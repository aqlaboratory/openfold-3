name: Reusable Docker Test for running heavy test loads (Pixi, AMD/ROCm)

on:
  # Can only be called by another workflow, not directly by the user
  workflow_call:
    inputs:
      pixi_env:
        description: 'Pixi environment name (ROCm, e.g. openfold3-rocm7)'
        required: true
        type: string
      base_image:
        description: 'Base Docker image'
        required: false
        type: string
        default: 'ubuntu:22.04'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openfold3-docker
  # Keep in step with DEFAULT_CHECKPOINT_NAME in openfold3/entry_points/parameters.py
  # and with the same variable in ci-integration-test-pixi-cuda-brev-reusable.yml.
  OPENFOLD_DEFAULT_CKPT: of3-ob-2025-06-30-174k.pt

# Unlike the NVIDIA path, the AMD GPU runner is a persistent self-hosted box
# (label: amd-gpu), so there is no AWS start/stop lifecycle — the job targets the
# runner directly and uses ROCm device passthrough instead of `--gpus all`.
jobs:
  test-openfold-docker-pixi-amd:
    runs-on: [self-hosted, amd-gpu]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # Named so the cleanup step can stop the container if the job is cancelled
      # or times out; unique per run so the two runners on this box cannot clash.
      TEST_CONTAINER: openfold3-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.pixi_env }}
    steps:
      # A previous job may have left root-owned files in this persistent
      # workspace (see "Reclaim workspace ownership" below), which makes checkout
      # fail with EACCES. Uses busybox rather than the test image so it works
      # before anything has been built.
      - name: Reclaim workspace ownership (pre-checkout)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/opt/openfold3 \
            busybox chown -R "$(id -u):$(id -g)" /opt/openfold3

      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.pixi
          target: test
          push: true
          build-args: |
            PIXI_ENV=${{ inputs.pixi_env }}
            BASE_IMAGE=${{ inputs.base_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.event.pull_request.head.sha || github.sha }}
          # Keyed by the lockfile that produced the environment layer; see
          # ci-test-pixi-reusable.yml for why an unkeyed tag is unsafe across
          # branches whose dependencies differ.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-${{ inputs.pixi_env }}-${{ hashFiles('pixi.lock') }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-${{ inputs.pixi_env }}-${{ hashFiles('pixi.lock') }},mode=max

      - name: Create parameter cache directory
        run: mkdir -p ~/.openfold3

      # No actions/cache here, deliberately as this runner is persistent
      # The checkpoint is verified by size against S3 and fetched if missing or
      # short. Downloading to a temp name and renaming means an interrupted
      # transfer never leaves a truncated file at the real path on this
      # persistent disk.
      - name: Ensure OpenFold parameters
        run: |
          set -euo pipefail
          f=~/.openfold3/$OPENFOLD_DEFAULT_CKPT
          url=https://openfold3-data.s3.amazonaws.com/openfold3-parameters/$OPENFOLD_DEFAULT_CKPT
          expected=$(curl -fsSI "$url" | awk 'tolower($1)=="content-length:"{print $2}' | tr -d '\r')
          actual=$( [ -f "$f" ] && wc -c < "$f" | tr -d " " || echo 0)
          if [ -n "$expected" ] && [ "$actual" = "$expected" ]; then
            echo "parameters present and complete: $f ($actual bytes)"
          else
            echo "parameters missing or incomplete (have $actual, want ${expected:-?} bytes); downloading"
            # Public bucket: plain HTTPS, so this runner needs no AWS CLI.
            curl -fSL "$url" -o "$f.part" && mv "$f.part" "$f"
          fi

      - name: Run integration test
        run: |
          # ROCm GPU access is via kfd/dri device passthrough, not the NVIDIA
          # container toolkit's `--gpus all`. Numeric group IDs grant access to
          # the render nodes without relying on group names existing in the image.
          rocm_group_args=()
          while IFS= read -r gid; do
            rocm_group_args+=(--group-add "$gid")
          done < <(
            for device in /dev/kfd /dev/dri/card* /dev/dri/renderD*; do
              [ -e "$device" ] && stat -c '%g' "$device"
            done | sort -u
          )

          docker run --rm \
            --name "$TEST_CONTAINER" \
            --device=/dev/kfd \
            --device=/dev/dri \
            "${rocm_group_args[@]}" \
            --shm-size=8g \
            --security-opt seccomp=unconfined \
            -v ${{ github.workspace }}:/opt/openfold3 \
            -v ~/.openfold3:/root/.openfold3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            pytest -x openfold3/tests/ -m "slow or gpu" -vvv -s \
              -o faulthandler_timeout=900

      - name: Reclaim workspace ownership
        # The container runs as root and writes .pytest_cache / __pycache__ into the
        # bind-mounted workspace, leaving root-owned files that this persistent
        # self-hosted runner's user cannot delete on the next checkout. Chown them
        # back to the runner user. Runs on failure too (pytest -x may exit non-zero).
        # Cancelling the job kills the `docker run` client but not the container,
        # so stop it first or it keeps writing root-owned files after the chown.
        # Uses busybox so this does not depend on the build step having succeeded.
        if: always()
        run: |
          docker rm -f "$TEST_CONTAINER" 2>/dev/null || true
          docker run --rm \
            -v ${{ github.workspace }}:/opt/openfold3 \
            busybox chown -R "$(id -u):$(id -g)" /opt/openfold3
