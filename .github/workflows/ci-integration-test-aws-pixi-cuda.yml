name: Reusable Docker Test for running heavy test loads (Pixi)

on:
  # Can only be called by another workflow, not directly by the user
  workflow_call:
    inputs:
      pixi_env:
        description: 'Pixi environment name (e.g., openfold3-cuda12, openfold3-cuda13)'
        required: true
        type: string
      base_image:
        description: 'Base Docker image'
        required: false
        type: string
        default: 'ubuntu:22.04'
      coverage:
        description: >-
          Measure coverage on this run: the *whole* suite rather than
          `-m "slow or gpu"`, and without `-x`.

          Both matter. Coverage from the GPU selection alone would miss
          everything the unit tests reach, and the fast CI tier cannot supply
          the remainder -- it runs on a CPU-only box with no weights, so every
          accelerator-gated test self-skips there. Running the lot on one GPU
          runner is what lets a single data file cover the CPU *and* GPU paths,
          with no cross-workflow `coverage combine` and no risk of line numbers
          from a different commit being attributed to this one.

          `-x` has to go because a fail-fast run measures only the code up to the
          first failure, which reports as a collapsed coverage number rather than
          as an error.

          Note this makes the job stop being a fast red signal: it runs longer and
          reports every failure instead of the first.
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openfold3-docker
  # The default checkpoint. Keep in step with DEFAULT_CHECKPOINT_NAME in
  # openfold3/entry_points/parameters.py.
  OPENFOLD_DEFAULT_CKPT: of3-ob-2025-06-30-174k.pt

jobs:
  start-aws-runner:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      # Whichever attempt launched wins; the other is an empty string, which is
      # falsy in Actions expressions.
      mapping: >-
        ${{ steps.launch_us_east_2.outputs.mapping || steps.launch_us_west_2.outputs.mapping }}
      instances: >-
        ${{ steps.launch_us_east_2.outputs.instances || steps.launch_us_west_2.outputs.instances }}
      # stop-aws-runner must terminate in whichever region actually won, or the
      # instance leaks.
      region: ${{ steps.winner.outputs.region }}
    env:
      AWS_INSTANCE_TYPE: "g5.4xlarge" # A10G 64 GB
      AWS_TAGS: >-
        [
          {"Key":"Name","Value":"of-gha-runner"},
          {"Key":"Repository","Value":"${{ github.repository }}"},
          {"Key":"Workflow","Value":"${{ github.workflow }}"},
          {"Key":"RunId","Value":"${{ github.run_id }}"},
          {"Key":"RunNumber","Value":"${{ github.run_number }}"},
          {"Key":"RunAttempt","Value":"${{ github.run_attempt }}"},
          {"Key":"Actor","Value":"${{ github.actor }}"},
          {"Key":"EventName","Value":"${{ github.event_name }}"},
          {"Key":"Ref","Value":"${{ github.ref_name }}"},
          {"Key":"Sha","Value":"${{ github.sha }}"}
        ]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203627415330:role/of-gha-runner
          aws-region: us-east-2

      # AMI ids are region-scoped, so the fallback region needs its own lookup.
      - name: Resolve GPU DLAMI from SSM per region
        id: resolve-ami
        run: |
          set -euo pipefail
          for region in us-east-2 us-west-2; do
            ami_id=$(aws ssm get-parameter --region "$region" \
              --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id \
              --query 'Parameter.Value' --output text)
            echo "${region//-/_}=$ami_id" >> "$GITHUB_OUTPUT"
            echo "$region: $ami_id"
          done

      # EC2 capacity is per (region, availability zone). start-aws-gha-runner
      # v1.4.0 walks every available zone in its own region when aws_subnet_id is
      # omitted, so zone fallback no longer lives here -- but the action does not
      # cross regions, and on 2026-09-09 all three us-east-2 zones were empty at
      # once. Hence one attempt per region. Do not set aws_subnet_id: pinning a
      # subnet disables the action's zone fallback entirely.
      - name: Create cloud runner (us-east-2)
        id: launch_us_east_2
        continue-on-error: true
        uses: omsf/start-aws-gha-runner@v1.4.0
        with:
          aws_image_id: ${{ steps.resolve-ami.outputs.us_east_2 }}  # Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04), resolved from SSM at runtime
          aws_instance_type: ${{ env.AWS_INSTANCE_TYPE }}
          aws_region_name: us-east-2
          aws_home_dir: /home/ubuntu
          aws_root_device_size: 200
          aws_tags: ${{ env.AWS_TAGS }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      # us-west-2 is also where s3://openfold3-data lives, so a fallback launch
      # gets same-region parameter downloads.
      - name: Create cloud runner (us-west-2)
        id: launch_us_west_2
        if: ${{ !steps.launch_us_east_2.outputs.instances }}
        continue-on-error: true
        uses: omsf/start-aws-gha-runner@v1.4.0
        with:
          aws_image_id: ${{ steps.resolve-ami.outputs.us_west_2 }}
          aws_instance_type: ${{ env.AWS_INSTANCE_TYPE }}
          aws_region_name: us-west-2
          aws_home_dir: /home/ubuntu
          aws_root_device_size: 200
          aws_tags: ${{ env.AWS_TAGS }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      # continue-on-error means a failed launch does not fail the job, so without
      # this the job would go green with empty outputs and the downstream runs-on
      # would break confusingly.
      - name: Report launch outcome
        id: winner
        run: |
          set -euo pipefail
          if [ -n "$INSTANCES_US_EAST_2" ]; then
            region=us-east-2
          elif [ -n "$INSTANCES_US_WEST_2" ]; then
            region=us-west-2
          else
            echo "::error::No capacity for $AWS_INSTANCE_TYPE in any zone of us-east-2 or us-west-2"
            exit 1
          fi
          echo "Launched in $region"
          echo "region=$region" >> "$GITHUB_OUTPUT"
        env:
          INSTANCES_US_EAST_2: ${{ steps.launch_us_east_2.outputs.instances }}
          INSTANCES_US_WEST_2: ${{ steps.launch_us_west_2.outputs.instances }}

  test-openfold-docker-pixi:
    runs-on: ${{ fromJSON(needs.start-aws-runner.outputs.instances) }}
    needs:
      - start-aws-runner
    # The plain run already takes ~40 min; the coverage run adds the rest of the
    # suite and the tracing overhead on the serialised slow tests.
    timeout-minutes: ${{ inputs.coverage && 90 || 60 }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.pixi
          target: test
          push: true
          build-args: |
            PIXI_ENV=${{ inputs.pixi_env }}
            BASE_IMAGE=${{ inputs.base_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.sha }}
          # Keyed by the lockfile that produced the environment layer; see
          # ci-test-pixi-reusable.yml for why an unkeyed tag is unsafe across
          # branches whose dependencies differ.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-${{ inputs.pixi_env }}-${{ hashFiles('pixi.lock') }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-${{ inputs.pixi_env }}-${{ hashFiles('pixi.lock') }},mode=max

      - name: Create parameter cache directory
        run: mkdir -p ~/.openfold3

      - name: Cache download of parameters
        id: cache-openfold_parameters
        uses: actions/cache@v6
        with:
          path: ~/.openfold3/
          key: params-cuda-${{ env.OPENFOLD_DEFAULT_CKPT }}

      # checkpoint is verified by size against the object in S3 and fetched if it
      # is missing or short, so a relocated or truncated cache entry self-heals
      # instead of skipping straight to a failing test.
      - name: Ensure OpenFold parameters
        run: |
          set -euo pipefail
          f=~/.openfold3/$OPENFOLD_DEFAULT_CKPT
          url=https://openfold3-data.s3.amazonaws.com/openfold3-parameters/$OPENFOLD_DEFAULT_CKPT
          expected=$(curl -fsSI "$url" | awk 'tolower($1)=="content-length:"{print $2}' | tr -d '\r')
          actual=$( [ -f "$f" ] && wc -c < "$f" | tr -d " " || echo 0)
          if [ -n "$expected" ] && [ "$actual" = "$expected" ]; then
            echo "parameters present and complete: $f ($actual bytes)"
          else
            echo "parameters missing or incomplete (have $actual, want ${expected:-?} bytes); downloading"
            curl -fSL "$url" -o "$f.part" && mv "$f.part" "$f"
          fi

      - name: Run integration test
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.sha }}"
          run_pytest() {
            docker run --rm --gpus all \
              --shm-size=8g \
              -v ${{ github.workspace }}:/opt/openfold3 \
              -v ~/.openfold3:/root/.openfold3 \
              "$image" pytest "$@" -o faulthandler_timeout=900
          }

          if [ "${{ inputs.coverage }}" != "true" ]; then
            run_pytest -x openfold3/tests/ -m "slow or gpu" -vvv -s
            exit
          fi

          # One invocation over the whole suite, so one .coverage file with no
          # `coverage combine` and no --cov-append bookkeeping.
          #
          # `--dist loadgroup` is what makes that affordable. The conftest puts
          # every `slow` and `gpu` test in one xdist group, and loadgroup runs a
          # group on a single worker -- so the accelerator tests serialise
          # against each other on the one A10G while the CPU-bound rest of the
          # suite still fans out. Without it this would have to run serially and
          # cost roughly half an hour more of GPU instance time.
          #
          # No -x: fail-fast would measure only the code up to the first failure
          # and report it as a collapsed coverage number. No -s either: xdist
          # workers cannot stream output to the terminal.
          run_pytest openfold3/tests/ -vvv -n auto --dist loadgroup \
            --cov=openfold3 --cov-report=xml --cov-report=term

      - name: Reclaim workspace ownership
        # The container runs as root, so coverage.xml and .coverage land in the
        # bind-mounted workspace owned by root and the runner user cannot read
        # them to upload. Runs on failure too, since a coverage run has no -x and
        # a partial result is still worth collecting.
        if: ${{ always() && inputs.coverage }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/opt/openfold3 \
            --entrypoint chown \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.sha }} \
            -R "$(id -u):$(id -g)" /opt/openfold3

      - name: Upload coverage report
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-integration-${{ inputs.pixi_env }}
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true
          retention-days: 30

      - name: Publish coverage summary
        # Puts the number on the job summary page so reading it does not mean
        # downloading an artifact.
        if: ${{ always() && inputs.coverage }}
        run: |
          if [ ! -f coverage.xml ]; then
            echo "No coverage.xml produced -- the test run likely died early." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          covered = int(root.get("lines-covered"))
          valid = int(root.get("lines-valid"))
          print("## Coverage — full suite on GPU")
          print()
          print(f"**{float(root.get('line-rate')) * 100:.1f}%** ({covered:,} / {valid:,} lines)")
          print()
          print("Whole suite in one pass on a GPU runner, so this covers the")
          print("accelerator paths the CPU-only PR tier has to skip.")
          PY

  stop-aws-runner:
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    needs:
      - start-aws-runner
      - test-openfold-docker-pixi
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203627415330:role/of-gha-runner
          # The runner may have launched in the fallback region; terminating in
          # the wrong one silently leaves the instance running.
          aws-region: ${{ needs.start-aws-runner.outputs.region || 'us-east-2' }}
      - name: Stop instances
        uses: omsf/stop-aws-gha-runner@v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
