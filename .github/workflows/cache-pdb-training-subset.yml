name: Cache PDB training subset for the training integration test

on:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openfold3-docker

jobs:
  check-pdb-subset-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-check.outputs.cache-hit }}
    steps:
      - name: Check PDB training subset cache
        id: cache-check
        uses: actions/cache/restore@v6
        with:
          path: /tmp/openfold3-pdb-subset
          key: shared-pdb-training-subset-v1
          lookup-only: true

      - name: Report cache status
        run: |
          if [ "${{ steps.cache-check.outputs.cache-hit }}" == "true" ]; then
            echo "::notice::Cache HIT (key shared-pdb-training-subset-v1) -- PDB training subset already cached, skipping AWS runner + regeneration entirely."
          else
            echo "::notice::Cache MISS (key shared-pdb-training-subset-v1) -- spinning up an AWS runner to regenerate."
          fi

  start-aws-runner:
    needs: check-pdb-subset-cache
    if: needs.check-pdb-subset-cache.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
      instances: ${{ steps.aws-start.outputs.instances }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203627415330:role/of-gha-runner
          aws-region: us-east-1
      - name: Create cloud runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@v1.3.0
        with:
          aws_image_id: ami-0754c6e75b3b97dcd  # Deep Learning AMI Neuron (Ubuntu 22.04)
          aws_instance_type: t3.2xlarge
          aws_market_type: spot
          aws_home_dir: /home/ubuntu
          aws_root_device_size: 200
          aws_tags: >-
            [
              {"Key":"Name","Value":"of-gha-runner"},
              {"Key":"Repository","Value":"${{ github.repository }}"},
              {"Key":"Workflow","Value":"${{ github.workflow }}"},
              {"Key":"RunId","Value":"${{ github.run_id }}"},
              {"Key":"RunNumber","Value":"${{ github.run_number }}"},
              {"Key":"RunAttempt","Value":"${{ github.run_attempt }}"},
              {"Key":"Actor","Value":"${{ github.actor }}"},
              {"Key":"EventName","Value":"${{ github.event_name }}"},
              {"Key":"Ref","Value":"${{ github.ref_name }}"},
              {"Key":"Sha","Value":"${{ github.sha }}"}
            ]
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  warm-pdb-subset-cache:
    needs:
      - check-pdb-subset-cache
      - start-aws-runner
    if: needs.check-pdb-subset-cache.outputs.cache-hit != 'true'
    runs-on: ${{ fromJSON(needs.start-aws-runner.outputs.instances) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile.pixi
          target: test
          push: true
          build-args: |
            PIXI_ENV=openfold3-cpu
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-openfold3-cpu-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-openfold3-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-openfold3-cpu,mode=max

      # A fixed, home-directory-independent path -- actions/cache bakes
      # whatever `$HOME` resolves to on the saving runner into the archive's
      # internal paths, and replays that literally on restore regardless of
      # the restoring machine's own `$HOME`. This runner runs its steps as
      # root, so `~` would resolve to `/root`, which a non-root restoring
      # runner (e.g. the amd-gpu box) has no permission to write to -- a
      # deterministic restore failure, confirmed via a real run. /tmp is
      # writable by any user without extra setup, avoiding that entirely.
      - name: Create PDB subset cache directory
        run: mkdir -p /tmp/openfold3-pdb-subset

      # Called separately with an explicit --target-dir each, rather than via
      # the setup-pdb-subset composite task -- pixi's depends-on tasks don't
      # reliably forward extra CLI args to their constituent tasks (verified:
      # `pixi run setup-pdb-subset --help` silently ran the whole pipeline
      # instead of showing help).
      - name: Sample PDB training subset
        run: |
          docker run --rm \
            -v /tmp/openfold3-pdb-subset:/root/.openfold3-pdb-subset \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-openfold3-cpu-${{ github.sha }} \
            pixi run -e openfold3-cpu generate-pdb-subset --target-dir /root/.openfold3-pdb-subset

      - name: Download PDB training subset files
        run: |
          docker run --rm \
            -v /tmp/openfold3-pdb-subset:/root/.openfold3-pdb-subset \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-openfold3-cpu-${{ github.sha }} \
            pixi run -e openfold3-cpu download-pdb-subset --target-dir /root/.openfold3-pdb-subset

      - name: Save PDB training subset cache
        uses: actions/cache/save@v6
        with:
          path: /tmp/openfold3-pdb-subset
          key: shared-pdb-training-subset-v1

  stop-aws-runner:
    needs:
      - check-pdb-subset-cache
      - start-aws-runner
      - warm-pdb-subset-cache
    if: ${{ always() && needs.check-pdb-subset-cache.outputs.cache-hit != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203627415330:role/of-gha-runner
          aws-region: us-east-1
      - name: Stop instances
        uses: omsf/stop-aws-gha-runner@v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
