name: Claude PR review

# A maintainer comments `@claude` on a PR (conversation or inline diff
# comment); Claude reviews it on a GitHub-hosted runner. No GPU, no secrets
# beyond the Claude token, and never pull_request_target.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Base branch at the workspace root (no `ref:`). The action fetches the
      # PR itself and restores .claude/ and CLAUDE.md from the base branch, so
      # a fork cannot smuggle in its own Claude configuration.
      - uses: actions/checkout@v7

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Review only: allow inline comments and read-only git, and take back
          # the commit/push tools that tag mode grants by default.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
