name: Reusable Docker Test for running heavy test loads on Brev (Pixi)

# Brev counterpart of ci-integration-test-aws-pixi-cuda.yml. The test job
# is the same; only the runner lifecycle differs. Brev picks the machine image
# (Ubuntu with Docker and the NVIDIA Container Toolkit) and the disk size comes
# with the instance type, so there is no AMI lookup or root device size here.

on:
  # Can only be called by another workflow, not directly by the user
  workflow_call:
    inputs:
      pixi_env:
        description: 'Pixi environment name (e.g., openfold3-cuda12, openfold3-cuda13)'
        required: true
        type: string
      base_image:
        description: 'Base Docker image'
        required: false
        type: string
        default: 'ubuntu:22.04'
      brev_instance_type:
        description: 'Brev instance type, or a comma-separated fallback chain. Find values with `brev search`.'
        required: true
        type: string
      coverage:
        description: >-
          Measure coverage on this run: the whole suite, without `-x`. See the
          same input in ci-integration-test-aws-pixi-cuda.yml for why.
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openfold3-docker
  # The default checkpoint. Keep in step with DEFAULT_CHECKPOINT_NAME in
  # openfold3/entry_points/parameters.py.
  OPENFOLD_DEFAULT_CKPT: of3-ob-2025-06-30-174k.pt

jobs:
  start-brev-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mapping: ${{ steps.brev-start.outputs.mapping }}
      instances: ${{ steps.brev-start.outputs.instances }}
    steps:
      # BREV_API_KEY is a Brev API key (not an NGC key). It belongs to one Brev
      # org, which the actions pick up from the key, and it expires on the date
      # set when it was created.
      - name: Create Brev runner
        id: brev-start
        uses: omsf-eco-infra/start-brev-gha-runner@8caae6a56ffe6f455278dea33e20b9b8dc003d4e # v1
        with:
          brev_instance_type: ${{ inputs.brev_instance_type }}
          brev_timeout: 900
        env:
          BREV_API_KEY: ${{ secrets.BREV_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}

  test-openfold-docker-pixi:
    runs-on: ${{ fromJSON(needs.start-brev-runner.outputs.instances) }}
    needs:
      - start-brev-runner
    # The plain run already takes ~40 min; the coverage run adds the rest of the
    # suite and the tracing overhead on the serialised slow tests.
    timeout-minutes: ${{ inputs.coverage && 90 || 60 }}
    permissions:
      contents: read
      packages: write
    steps:
      # The runner is installed under $HOME/gha-runner by the start action; this
      # records which user it runs as and whether that user can reach the GPU
      # through Docker.
      - name: Describe runner
        run: |
          set -x
          whoami
          nvidia-smi
          docker info
          docker run --rm --gpus all ubuntu:22.04 nvidia-smi -L
          df -h / "$GITHUB_WORKSPACE"
          nproc
          free -g

      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.pixi
          target: test
          push: true
          build-args: |
            PIXI_ENV=${{ inputs.pixi_env }}
            BASE_IMAGE=${{ inputs.base_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-${{ inputs.pixi_env }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-pixi-${{ inputs.pixi_env }},mode=max

      - name: Create parameter cache directory
        run: mkdir -p ~/.openfold3

      - name: Cache download of parameters
        id: cache-openfold_parameters
        uses: actions/cache@v6
        with:
          path: ~/.openfold3/
          key: params-cuda-${{ env.OPENFOLD_DEFAULT_CKPT }}

      # checkpoint is verified by size against the object in S3 and fetched if it
      # is missing or short, so a relocated or truncated cache entry self-heals
      # instead of skipping straight to a failing test.
      - name: Ensure OpenFold parameters
        run: |
          set -euo pipefail
          f=~/.openfold3/$OPENFOLD_DEFAULT_CKPT
          url=https://openfold3-data.s3.amazonaws.com/openfold3-parameters/$OPENFOLD_DEFAULT_CKPT
          expected=$(curl -fsSI "$url" | awk 'tolower($1)=="content-length:"{print $2}' | tr -d '\r')
          actual=$( [ -f "$f" ] && wc -c < "$f" | tr -d " " || echo 0)
          if [ -n "$expected" ] && [ "$actual" = "$expected" ]; then
            echo "parameters present and complete: $f ($actual bytes)"
          else
            echo "parameters missing or incomplete (have $actual, want ${expected:-?} bytes); downloading"
            curl -fSL "$url" -o "$f.part" && mv "$f.part" "$f"
          fi

      - name: Run integration test
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.sha }}"
          run_pytest() {
            docker run --rm --gpus all \
              --shm-size=8g \
              -v ${{ github.workspace }}:/opt/openfold3 \
              -v ~/.openfold3:/root/.openfold3 \
              "$image" pytest "$@" -o faulthandler_timeout=900
          }

          if [ "${{ inputs.coverage }}" != "true" ]; then
            run_pytest -x openfold3/tests/ -m "slow or gpu" -vvv -s
            exit
          fi

          # Same invocation as the AWS workflow; see the comment there.
          run_pytest openfold3/tests/ -vvv -n auto --dist loadgroup \
            --cov=openfold3 --cov-report=xml --cov-report=term

      - name: Reclaim workspace ownership
        # The container runs as root, so coverage.xml and .coverage land in the
        # bind-mounted workspace owned by root and the runner user cannot read
        # them to upload.
        if: ${{ always() && inputs.coverage }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/opt/openfold3 \
            --entrypoint chown \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-pixi-${{ inputs.pixi_env }}-${{ github.sha }} \
            -R "$(id -u):$(id -g)" /opt/openfold3

      - name: Upload coverage report
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v7
        with:
          # Distinct from the AWS job's name: both run in the same workflow run
          # and artifact names must be unique within it.
          name: coverage-report-integration-brev-${{ inputs.pixi_env }}
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true
          retention-days: 30

      - name: Publish coverage summary
        if: ${{ always() && inputs.coverage }}
        run: |
          if [ ! -f coverage.xml ]; then
            echo "No coverage.xml produced -- the test run likely died early." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          covered = int(root.get("lines-covered"))
          valid = int(root.get("lines-valid"))
          print("## Coverage — full suite on GPU (Brev)")
          print()
          print(f"**{float(root.get('line-rate')) * 100:.1f}%** ({covered:,} / {valid:,} lines)")
          print()
          print("Whole suite in one pass on a GPU runner, so this covers the")
          print("accelerator paths the CPU-only PR tier has to skip.")
          PY

  stop-brev-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - start-brev-runner
      - test-openfold-docker-pixi
    if: ${{ always() }}
    steps:
      # `brev delete` removes the instance and its storage; `brev stop` would
      # keep billing for the disk.
      - name: Delete Brev runner
        if: ${{ needs.start-brev-runner.outputs.mapping }}
        uses: omsf-eco-infra/stop-brev-gha-runner@4b88a4d25877aafb37ca29f5f49996ab0af76ab6 # v1
        with:
          instance_mapping: ${{ needs.start-brev-runner.outputs.mapping }}
        env:
          BREV_API_KEY: ${{ secrets.BREV_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
