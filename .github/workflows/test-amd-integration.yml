name: Test workflow for running with AMD 

on:
  push:
  workflow_dispatch:

jobs:
  # AMD/ROCm path: runs on the persistent self-hosted runner (label: amd-gpu)
  # instead of an ephemeral AWS NVIDIA instance — no id-token/AWS OIDC needed.
  test-pixi-amd:
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - pixi_env: "openfold3-rocm7"
    concurrency:
      group: ${{ github.workflow }}-pixi-amd-${{ github.head_ref || github.ref }}-${{ matrix.pixi_env }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci-integration-test-pixi-amd-reusable.yml
    with:
      pixi_env: ${{ matrix.pixi_env }}
    secrets: inherit
