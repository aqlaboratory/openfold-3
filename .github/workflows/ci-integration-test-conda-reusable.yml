name: Reusable Docker Test for running heavy test loads

on:
  # Can only be called by another workflow, not directly by the user
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode: "lock" for reproducible builds, "yaml" for flexible dev builds'
        required: true
        type: string
      cuda_base_image_tag:
        description: 'CUDA base image tag (e.g., 12.2.2-cudnn8-devel-ubuntu22.04)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openfold3-docker

jobs:
  start-aws-runner:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
      instances: ${{ steps.aws-start.outputs.instances }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203627415330:role/of-gha-runner
          aws-region: us-east-2
      - name: Resolve GPU DLAMI from SSM
        id: resolve-ami
        run: |
          ami_id=$(aws ssm get-parameter \
            --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id \
            --query 'Parameter.Value' --output text)
          echo "ami_id=$ami_id" >> "$GITHUB_OUTPUT"
      - name: Create cloud runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@v1.3.0
        with:
          aws_image_id: ${{ steps.resolve-ami.outputs.ami_id }}  # Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04), resolved from SSM at runtime
          aws_instance_type: "g5.4xlarge" # A10G 64 GB 
          aws_home_dir: /home/ubuntu
          aws_root_device_size: 200
          aws_tags: >-
            [
              {"Key":"Name","Value":"of-gha-runner"},
              {"Key":"Repository","Value":"${{ github.repository }}"},
              {"Key":"Workflow","Value":"${{ github.workflow }}"},
              {"Key":"RunId","Value":"${{ github.run_id }}"},
              {"Key":"RunNumber","Value":"${{ github.run_number }}"},
              {"Key":"RunAttempt","Value":"${{ github.run_attempt }}"},
              {"Key":"Actor","Value":"${{ github.actor }}"},
              {"Key":"EventName","Value":"${{ github.event_name }}"},
              {"Key":"Ref","Value":"${{ github.ref_name }}"},
              {"Key":"Sha","Value":"${{ github.sha }}"}
            ]          
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  test-openfold-docker:
    runs-on: ${{ fromJSON(needs.start-aws-runner.outputs.instances) }}
    needs:
      - start-aws-runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile.conda
          target: test
          push: true
          build-args: |
            CUDA_BASE_IMAGE_TAG=${{ inputs.cuda_base_image_tag }}
            BUILD_MODE=${{ inputs.build_mode }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ inputs.cuda_base_image_tag }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-conda-${{ inputs.cuda_base_image_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-conda-${{ inputs.cuda_base_image_tag }},mode=max
      
      - name: Create parameter cache directory
        run: mkdir -p ~/.openfold3

      - name: Cache download of parameters 
        id: cache-openfold_parameters
        uses: actions/cache@v6
        with:
          path: ~/.openfold3/
          key: shared-params_of3
          restore-keys: |
            shared-params_of3
    
      - name: Download OpenFold parameters
        # openfold3 owns the download: `setup_openfold` resolves the checkpoint file
        # name from OPENFOLD_MODEL_CHECKPOINT_REGISTRY, writes `ckpt_root`, sets up the
        # Biotite CCD, and skips any transfer that is already on disk
        # (force_download=False), so this is a no-op on a good cache restore. It runs
        # inside the image, so the host needs neither the AWS CLI nor credentials --
        # the bucket is public and boto3 comes with the environment.
        #
        # Deliberately NOT gated on `cache-hit`: a restored archive is only useful if it
        # lands in the directory that gets mounted, and checking for the file is the
        # honest test of that. `--non-interactive` takes the OpenFoldSetupConfig
        # defaults, which fetch only the default checkpoint and leave
        # run_integration_tests False -- the tests are the next step's job.
        run: |
          docker run --rm \
            -v ~/.openfold3:/root/.openfold3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ inputs.cuda_base_image_tag }}-${{ github.sha }} \
            setup_openfold --non-interactive
      
      - name: Run integration test
        run: |
          docker run --gpus all\
            -v ${{ github.workspace }}:/opt/openfold3 \
            -v ~/.openfold3:/root/.openfold3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ inputs.cuda_base_image_tag }}-${{ github.sha }} \
            pytest -x openfold3/tests/ -m slow -vvv

  stop-aws-runner:
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    needs:
      - start-aws-runner
      - test-openfold-docker
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203627415330:role/of-gha-runner
          aws-region: us-east-2
      - name: Stop instances
        uses: omsf/stop-aws-gha-runner@v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
