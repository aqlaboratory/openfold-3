#
# This is a pixi (https://pixi.sh) manifest to manage environments for OpenFold-3.
# TL;DR:
#   pixi run run_openfold
#
# Installing pixi
# ---------------
# If you have not pixi installed, please follow the instructions here:
#   https://pixi.sh/latest/installation/
# Which in linux boils down to run:
#   curl -fsSL https://pixi.sh/install.sh | sh
# Optionally, please install shell completions.
# Then restart your shell.
#
# Platforms and hardware support
# ------------------------------
# We support linux-64, linux-aarch64, osx-64 and osx-arm64 platforms and provide the following environments:
#   - openfold3-cpu (alias for default): base environment without CUDA, to enable developing without GPU
#   - openfold3-cuda12 and openfold-cuda13: environments with cuda, deepspeed and cuequivariance
#
# The current environments pass all inference tests available in each platform.
# (aarch64 and osx-64 are untested at the moment).
# The GPU versions work at least from NVIDIA Ampere to Blackwell microarchitectures
#
# Using the environments
# ----------------------
# Change to the openfold-3 directory and run any command using the pixi shim.
#   pixi run -e openfold3-cuda12 pytest -v .
#   pixi run run_openfold
#
# If you want to run out of the openfold-3 environment, there are multiple options:
#  use `pixi shell` to allow running out of the directory and saving prefixing with "pixi run".
#  use detached environments or specify a different manifest location
# If you prefer to use conda, the environments can be exported to regular conda yamls:
#   pixi workspace export conda-environment -n openfold3
# (note that at the moment this does not export environment variable definitios
#  which we use for isolating deepspeed extension building)
#

[workspace]
name = "openfold3"
authors = []
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
version = "0.1.0"
requires-pixi = ">=0.62"

# --- Environments

[environments]
default = { features = ["openfold3-cpu"] }  # Any better way to alias or remove the default environment?
openfold3-cpu = { features = ["openfold3-cpu"] }
openfold3-cuda12 = { features = [
    "openfold3-cpu",
    "cuda12",
    "deepspeed",
    "deepspeed-cuda12",
    "cuequivariance",
    "cuequivariance-cuda12"
] }
openfold3-cuda13 = { features = [
    "openfold3-cpu",
    "cuda13",
    "deepspeed",
    "deepspeed-cuda13",
    "cuequivariance",
    "cuequivariance-cuda13"
] }
# Maybe we should have solve-groups, but how to conciliate between e.g. cu12 and cu13?
# N.B. at the moment all these are editable installs

# --- CPU (base) environment

[feature.openfold3-cpu.dependencies]

# Explicit basics that could get anyway installed
python = "*"
numpy = "*"
scipy = "*"
pandas = "*"

# In case we need some hacks / post-modifications
# (pixi joint pypi/conda resolution is too good and does not allow sometimes necessary evil)
# Here at least until we get CF cuda13 dependencies
pip = "*"

# --- Pytorch & its accelerators
# Note that we use a pixi feature on top for taking care of GPU environments.
# We take advantage that pytorch and pytorch-gpu are compatible packages.
pytorch = "*"

# --- More ML
ml-collections = "*"
pytorch-lightning = "*"

# --- Handling molecules
rdkit = "*"
pdbeccdutils = "*"

# --- Bioinformatics & Workflows
hmmer = "*"
hhsuite = "*"
kalign2 = "*"
snakemake = "*"

# --- Misc
pyyaml = "*"
ijson = "*"
memory_profiler = "*"
wandb = "*"
func_timeout = "*"
tqdm = "*"
typing-extensions = "*"
python-lmdb = "*"

# --- Downloading stuff
requests = "*"
awscli = "*"
boto3 = "*"
aria2 = "*"

# --- Testing
pytest = "*"

# --- Dev and documentation optionals
# We do not put on a feature to avoid combinatorial explosion.
ruff = "*"
sphinx = "*"
myst-parser = "*"
furo = "*"

[feature.openfold3-cpu.pypi-dependencies]

# --- OpenFold3 in editable mode
# The goal here would be to avoid getting anything installed from pypi in this step.
# TODO: we should provide this as an optional in the environment (matrix devel vs prod)
openfold3 = { path = ".", editable = true }

[feature.openfold3-cpu.target.linux-64.dependencies]
mkl = "*"
biotite = "<1.3"

[feature.openfold3-cpu.target.linux-aarch64.dependencies]
# biotite = "<1.3"
# Uncomment when our upstream package addition gets published, add back to default deps, and remove next ones
# See https://github.com/conda-forge/biotite-feedstock/pull/81 and related PRs

[feature.openfold3-cpu.target.linux-aarch64.pypi-dependencies]
# Remove all these biotite special cases once we get an aarch conda package
# Note that it is unclear this will be a fully correct installation (see biotite docs about CCD generation)
biotite = "<1.3"

[feature.openfold3-cpu.target.osx-64.dependencies]
biotite = "<1.3"

[feature.openfold3-cpu.target.osx-arm64.dependencies]
biotite = "<1.3"

# --- Cuda

[feature.cuda12]

  platforms = ["linux-64", "linux-aarch64"]

  [feature.cuda12.system-requirements]
  cuda = "12.0"

  [feature.cuda12.dependencies]
  cuda-version = ">=12,<13"
  pytorch-gpu = "*"

 [feature.cuda13]

  platforms = ["linux-64", "linux-aarch64"]

  [feature.cuda13.system-requirements]
  cuda = "13.0"

  [feature.cuda13.dependencies]
    cuda-version = ">=13,<14"
    # Blocked by CF not publishing pytorch against CUDA 13 yet.
    # See: https://github.com/conda-forge/pytorch-cpu-feedstock/pull/457
    # pytorch-gpu = "*"d

  [feature.cuda13.pypi-dependencies]
  torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

# --- DeepSpeed
# TODO: make deepspeed CF package for linux_aarch64
#       note: https://github.com/deepspeedai/DeepSpeed/issues/5640
#             https://github.com/conda-forge/deepspeed-feedstock/pull/81
#       but it does seem to work, according to:
#             https://github.com/aqlaboratory/openfold-3/issues/78

[feature.deepspeed]

  # N.B. aarch64 is not officially supported (yet), but seems to be working (for OF3-used primitives at least)
  platforms = ["linux-64", "linux-aarch64"]

  [feature.deepspeed.activation]
  # Trick deepspeed - we could also point to $CONDA_PREFIX
  env.CUTLASS_PATH = "DS_IGNORE_CUTLASS_DETECTION"
  # --- Isolating completely the environment, including built extensions
  # Note that this might not play well with advanced users or people who do not want to recompile
  # So we likely do not want to enforce it or document it well

  # Change triton cache to be local
  env.TRITON_CACHE_DIR = "$CONDA_PREFIX/caches/triton"
  # Change torch caches
  env.TORCH_HOME = "$CONDA_PREFIX/caches/pytorch"
  env.TORCH_EXTENSIONS_DIR = "$CONDA_PREFIX/caches/torch_extensions"
  env.DS_BUILD_CACHE_DIR = "$CONDA_PREFIX/caches/deepspeed"

  # FIXME: A few temporary variants:
  #   - soon deepspeed will have cuda13 package in CF
  #   - aarch64 is not officially supported, so at the moment installing from sdist and crossing fingers
  [feature.deepspeed-cuda12.target.linux-64.dependencies]
  deepspeed = ">=0.18.3"
  [feature.deepspeed-cuda12.target.linux-aarch64.pypi-dependencies]
  deepspeed = ">=0.18.3"
  [feature.deepspeed-cuda13.pypi-dependencies]
  deepspeed = ">=0.18.3"

  [feature.deepspeed.dependencies]
  # These are only needed to build local extensions the first time
  # Think on whether we want to delete them afterwards and how it would play with the user
  ninja = "*"
  cutlass = "*"
  cuda-minimal-build = "*"
  libcusparse-dev = "*"
  libcublas-dev = "*"
  libcusolver-dev = "*"
  libcurand-dev = "*"

  # These are installed by pypi nvidia-cutlass
  # But we want them to be conda-aware so they are compatible with our env
  # treelib = "*"
  # pydot = "*"
  # This is needed to agree with the pin in openfold-3 dependencies
  # This actually pins down other conda deps, and it is not needed in conda-world
  # cuda-python = "<12.9.1"

  [feature.deepspeed.pypi-dependencies]

  # --- Poor native library detection from DeepSpeed

  # DeepSpeed relies on cutlass python interface only for checking that cutlass is installed.
  # Here where this check was added:
  #   https://github.com/deepspeedai/DeepSpeed/commit/51da191eb54b69224edfb7cb4ce69db9a88956f7
  # Note that this interface is DEPRECATED and not shipped anymore after cutlass 3.8.0
  #   https://github.com/NVIDIA/cutlass/discussions/2119
  #   https://github.com/NVIDIA/cutlass/issues/2549
  # In conda environments, cutlass is well configured and works perfectly when building the extension
  # No python bindings are at the moment included in the conda package (arguably we should also include them)
  #   https://github.com/conda-forge/cutlass-feedstock/blob/main/recipe/meta.yaml
  # The best solution would be to patch deepspeed upstream to have a python independent way to assess the availability of cutlass.
  # These chores are of course well known:
  #   https://github.com/aqlaboratory/openfold-3/blob/3ba7b3589798eb2c60e78fa2c0ec25bd18decc92/openfold3/hacks.py#L1-L21
  #   https://github.com/aqlaboratory/openfold-3/blob/3ba7b3589798eb2c60e78fa2c0ec25bd18decc92/pyproject.toml#L33-L41
  # Note that this pins down some other cuda dependencies and add other dependencies, which is a bad side effect
  # Even more problematic, pytorch itself depends on cutlass python API, with this triaged issue
  #   https://github.com/pytorch/pytorch/issues/157456
  # This is particularly relevant:
  #   https://github.com/pytorch/pytorch/blob/82eefaedd98b63de8a87e34275af781f8eb177e1/torch/_inductor/codegen/cuda/cutlass_utils.py#L63
  # nvidia-cutlass = "==3.8"

  # While this is closed (as they can now use pip check to test) we still need to install ninja-python
  #   https://github.com/conda-forge/deepspeed-feedstock/issues/1
  #   https://github.com/conda-forge/deepspeed-feedstock/pull/100
  #   https://github.com/conda-forge/deepspeed-feedstock/commit/87cec8c4344b8eaefa3d17bffb69e2c83c28a82a
  # DeepSpeed still cannot find conda-forge ninja, owing to this issue
  #   https://github.com/conda-forge/ninja-feedstock/issues/26
  # ninja = "*"

# --- CuEquivariance
# https://developer.nvidia.com/cuequivariance#section-get-started

[feature.cuequivariance]

  [feature.cuequivariance.dependencies]
  # N.B., tests fail with cuequivariance >=0.8, need to assess + pinning in the meantime
  cuequivariance = "<0.8"
  cuequivariance-torch = "<0.8"

  # Missing packages for cuequivariance kernels
  # At the moment the optimized kernels are not distributed in conda-forge
  #   * cuequivariance-ops-torch-cu12
  # There are no sources and LICENSE does not allow to redistribute wheels, so not very CF friednly.
  # This install some other libs from pypi:
  #   * cuequivarance-ops-cu12
  #   * nvidia-cublas-cu12
  # With cublas being the problematic one - also packaged in CF but not clobbering
  # We would need to also package this in conda-forge
  # See also: https://github.com/NVIDIA/cuEquivariance/issues/218
  [feature.cuequivariance-cuda12]
    [feature.cuequivariance-cuda12.pypi-dependencies]
    # we need to coordinate this with the conda packages, or install all from pypi
    cuequivariance-ops-torch-cu12 = "<0.8"

  [feature.cuequivariance-cuda13]
    platforms = ["linux-64"]  # FIXME: There are no wheels for cuequivariance-ops-torch-cu13 for versions <0.8
    [feature.cuequivariance-cuda13.dependencies]
    triton = "*"
    [feature.cuequivariance-cuda13.pypi-dependencies]
    # we need to coordinate this with the conda packages, or install all from pypi
    cuequivariance-ops-torch-cu13 = "<0.8"
