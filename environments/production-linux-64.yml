name: openfold3-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python
  - awscli
  - setuptools
  - pip
  - conda-forge::uv
  - pytorch-lightning<=2.6.1
  - biopython
  - numpy
  - pandas
  - PyYAML
  - requests
  - scipy
  - tqdm
  - typing-extensions
  - wandb
  - modelcif
  - ml-collections
  - mkl
  - rdkit=2025.09.3
  - biotite
  - mmseqs2
  - bioconda::hmmer
  - bioconda::hhsuite
  - bioconda::snakemake
  - conda-forge::pytorch-gpu
  - conda-forge::cuda-version>=12,<13
  - conda-forge::cuda-cudart-dev
  - conda-forge::deepspeed>=0.19,<0.20
  - memory_profiler
  - func_timeout
  - boto3
  - conda-forge::python-lmdb=1.6
  - conda-forge::ijson
  - pip:
      - pdbeccdutils
      - kalign-python
